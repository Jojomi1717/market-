<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Ma Paroisse — logos</title>
<style>
@font-face{font-family:Poppins;font-weight:300;src:url(p300.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(p500.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(p600.woff2)}
:root{--deep:#163E86;--blue:#2563C9;--light:#EAF1FB;--mute:#6B7FA6}
*{box-sizing:border-box}
body{margin:0;background:#F6F8FC;font-family:Poppins,sans-serif;color:var(--deep);width:1400px;padding:56px}
h1{font-weight:600;font-size:34px;margin:0 0 6px}
.sub{color:var(--mute);font-size:17px;margin:0 0 40px}
.row{display:grid;grid-template-columns:250px 1fr 1fr 170px;gap:20px;align-items:stretch;margin-bottom:26px}
.lab{padding:18px 4px}
.lab b{display:block;font-size:13px;letter-spacing:.14em;color:var(--blue);font-weight:600;margin-bottom:8px}
.lab span{display:block;font-weight:600;font-size:22px;margin-bottom:8px}
.lab p{margin:0;font-size:14px;line-height:1.5;color:var(--mute)}
.panel{border-radius:22px;display:flex;align-items:center;justify-content:center;height:210px}
.w{background:#fff;box-shadow:0 1px 0 #E3E9F4,0 8px 24px rgba(22,62,134,.06)}
.b{background:var(--blue)}
.app{background:transparent;flex-direction:column;gap:10px;font-size:12px;color:var(--mute)}
.pal{display:flex;gap:14px;margin-top:34px;align-items:center;font-size:14px;color:var(--mute)}
.sw{width:46px;height:46px;border-radius:12px;border:1px solid #DDE5F2}
</style></head><body>
<h1>Ma Paroisse — propositions de logo</h1>
<p class="sub">Bleu et blanc dominants · police Poppins · chaque logo en version claire, inversée et icône d’application</p>
<div id="rows"></div>
<div class="pal">
  <div class="sw" style="background:#163E86"></div> Bleu nuit #163E86
  <div class="sw" style="background:#2563C9;margin-left:18px"></div> Bleu Marie #2563C9
  <div class="sw" style="background:#EAF1FB;margin-left:18px"></div> Bleu ciel #EAF1FB
  <div class="sw" style="background:#FFFFFF;margin-left:18px"></div> Blanc #FFFFFF
</div>
<script>
const DEEP='#163E86', BLUE='#2563C9', LIGHT='#EAF1FB', W='#FFFFFF';
// icon glyphs, 120×120 box; bg = shape colour, fg = glyph colour
const ICONS = {
  clocher: (bg, fg) => `
    <rect x="0" y="0" width="120" height="120" rx="30" fill="${bg}"/>
    <rect x="57" y="14" width="6" height="22" rx="1.5" fill="${fg}"/>
    <rect x="50" y="20" width="20" height="6" rx="1.5" fill="${fg}"/>
    <path d="M60 38 L78 56 V98 H42 V56 Z" fill="${fg}"/>
    <path d="M26 98 V72 L42 60 V98 Z M94 98 V72 L78 60 V98 Z" fill="${fg}" opacity=".78"/>
    <path d="M52.5 98 V84 a7.5 7.5 0 0 1 15 0 V98 Z" fill="${bg}"/>
    <circle cx="60" cy="66" r="5.5" fill="${bg}"/>`,
  bulle: (bg, fg) => `
    <path d="M30 12 H90 a24 24 0 0 1 24 24 V70 a24 24 0 0 1 -24 24 H48 L26 112 L30 92 a24 24 0 0 1 -24 -22 V36 a24 24 0 0 1 24 -24 Z" fill="${bg}"/>
    <rect x="54.5" y="26" width="11" height="54" rx="3" fill="${fg}"/>
    <rect x="40" y="40" width="40" height="11" rx="3" fill="${fg}"/>`,
  repere: (bg, fg) => `
    <path d="M60 6 C33 6 15 25 15 50 C15 80 60 114 60 114 C60 114 105 80 105 50 C105 25 87 6 60 6 Z" fill="${bg}"/>
    <circle cx="60" cy="50" r="27" fill="${fg}"/>
    <rect x="56.5" y="33" width="7" height="34" rx="2" fill="${bg}"/>
    <rect x="47" y="43" width="26" height="7" rx="2" fill="${bg}"/>
    <path d="M30 108 Q60 98 90 108" stroke="${bg}" stroke-width="4" fill="none" stroke-linecap="round" opacity=".35"/>`
};
function lockup(icon, shape, glyph, text, tag){
  return `<svg viewBox="0 0 490 130" style="width:86%;height:auto">
    <g transform="translate(0,5)">${ICONS[icon](shape, glyph)}</g>
    <text x="140" y="74" font-family="Poppins" font-size="44" fill="${text}"><tspan font-weight="300">Ma</tspan><tspan font-weight="600" dx="10">Paroisse</tspan></text>
    <text x="142" y="104" font-family="Poppins" font-weight="500" font-size="13.5" letter-spacing="2" fill="${tag}">VOTRE COMMUNAUTÉ, CONNECTÉE</text>
  </svg>`;
}
const appIcon = (icon) => `<svg width="120" height="120" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="28" fill="${BLUE}"/>
  <g transform="translate(22,22) scale(.633)">${ICONS[icon](W, BLUE)}</g></svg>`;
const rows = [
  ['01','Le Clocher','L’église, repère familier du village :&nbsp;simple, rassurant, reconnaissable même en tout petit.','clocher'],
  ['02','La Parole','Une bulle de discussion portant la croix :&nbsp;la paroisse qui échange, informe et rassemble.','bulle'],
  ['03','Le Repère','Une épingle de carte avec la croix :&nbsp;trouver sa paroisse, ses messes et ses activités.','repere'],
];
document.getElementById('rows').innerHTML = rows.map(([n,t,d,ic]) => `
  <div class="row">
    <div class="lab"><b>PROPOSITION ${n}</b><span>${t}</span><p>${d}</p></div>
    <div class="panel w">${lockup(ic, BLUE, W, DEEP, '#7E93BC')}</div>
    <div class="panel b">${lockup(ic, W, BLUE, W, 'rgba(255,255,255,.75)')}</div>
    <div class="panel app">${appIcon(ic)}icône d’app</div>
  </div>`).join('');
window.ICONS = ICONS; window.lockup = lockup;
</script></body></html>
